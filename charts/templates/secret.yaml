{{- if (and (hasKey .Values.secret "enabled") (.Values.secret.enabled)) }}
{{- /*
  PC authentication: the driver requires EITHER a Service Account API
  key (preferred) OR a username/password pair. We render PC_API_KEY when
  pc_api_key is supplied and otherwise fall back to PC_SECRET. Existing
  deployments that only set pc_username/pc_password continue to work
  unchanged.
*/ -}}
{{- $pcAPIKey := .Values.secret.pc_api_key | default "" -}}
{{- if and (eq $pcAPIKey "") (or (eq (.Values.secret.pc_username | default "") "") (eq (.Values.secret.pc_password | default "") "")) -}}
{{- fail "secret.pc_api_key or both secret.pc_username and secret.pc_password are required" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  annotations:
{{ include "cosi-driver-nutanix.resource.annotations" . | indent 4 }}
  labels:
{{ include "cosi-driver-nutanix.resource.labels" . | indent 4 }}
  name: objectstorage-provisioner
  namespace: {{ .Release.Namespace }}
stringData:
  ACCESS_KEY: {{ required "access_key is required." .Values.secret.access_key | quote }}
  ACCOUNT_NAME: {{ .Values.secret.account_name | quote }}
  ENDPOINT: {{ required "endpoint is required." .Values.secret.endpoint | quote }}
  PC_ENDPOINT: "{{ required "pc_endpoint is required." .Values.secret.pc_endpoint }}"
  {{- if ne $pcAPIKey "" }}
  PC_API_KEY: {{ $pcAPIKey | quote }}
  {{- else }}
  PC_SECRET: "{{ .Values.secret.pc_username }}:{{ .Values.secret.pc_password }}"
  {{- end }}
  SECRET_KEY: {{ required "secret_key is required." .Values.secret.secret_key | quote }}
  S3_INSECURE: {{ .Values.tls.s3.insecure | default "false" | quote }}
  PC_INSECURE: {{ .Values.tls.pc.insecure | default "false" | quote }}
  {{- if not .Values.tls.caSecretName }}
  S3_CA_CERT: {{ .Values.tls.s3.rootCAs | default "" }}
  PC_CA_CERT: {{ .Values.tls.pc.rootCAs | default "" }}
  {{- end }}
type: Opaque
{{- end }}
